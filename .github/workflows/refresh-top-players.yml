name: Refresh top players

on:
  schedule:
    - cron: "0 3 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-top-players
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install npm dependencies
        working-directory: web
        run: npm ci

      # No browser: the script fetches raw saves from the IT profiles API and
      # scores them with our tome engine. It exits non-zero when fewer than
      # 10 players could be computed, so a broken fetch fails the run instead
      # of committing a timestamp-only bump.
      - name: Compute top-player snapshot
        working-directory: web
        run: npx tsx scripts/update-top-players.ts

      - name: Commit refreshed snapshot
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if git diff --quiet web/lib/tome/topPlayers.ts; then
            echo "Snapshot unchanged, nothing to commit."
            exit 0
          fi
          git add web/lib/tome/topPlayers.ts
          git commit -m "chore: auto-refresh top-player snapshot"
          git push
